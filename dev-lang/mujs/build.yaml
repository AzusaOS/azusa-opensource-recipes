versions:
  list:
    - "1.3.10"
  stable: "1.3.10"
build:
  - version: "*"
    source:
      - https://mujs.com/downloads/${P}.tar.gz
    engine: none
    import:
      - readline
    compile_pre:
      - make VERSION=${PV} prefix=/pkg/main/${PKG}.core.${PVRF} XCFLAGS="${CFLAGS}" XCPPFLAGS="${CPPFLAGS}" READLINE_LIBS="${LDFLAGS} -lreadline" release
    install_post:
      - make DESTDIR="${D}" VERSION=${PV} prefix=/pkg/main/${PKG}.core.${PVRF} libdir="/pkg/main/${PKG}.libs.${PVRF}/lib$LIB_SUFFIX" install-shared
